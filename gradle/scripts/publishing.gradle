import com.vanniktech.maven.publish.JavaLibrary
import com.vanniktech.maven.publish.JavadocJar

apply plugin: 'com.vanniktech.maven.publish'

mavenPublishing {
    publishToMavenCentral()
    signAllPublications()

    // Publish a thin JAR with an empty javadoc stub. JDK 17's javadoc generates
    // several MB of CSS/JS boilerplate even for tiny libraries; using Empty() avoids
    // running the javadoc task entirely and keeps the Maven deployment under 80MB.
    configure(new JavaLibrary(new JavadocJar.Empty(), true))

    coordinates("org.apktool", project.name, project.apktoolVersion)

    pom {
        name = "Apktool"
        description = "A tool for reverse engineering Android apk files."
        url = "https://apktool.org"

        licenses {
            license {
                name = "The Apache License 2.0"
                url = "https://opensource.org/licenses/Apache-2.0"
            }
        }
        developers {
            developer {
                id = "iBotPeaches"
                name = "Connor Tumbleson"
                email = "connor.tumbleson@gmail.com"
            }
            developer {
                id = "brutall"
                name = "Ryszard Wiśniewski"
                email = "brut.alll@gmail.com"
            }
        }
        scm {
            connection = "scm:git:git://github.com/iBotPeaches/Apktool.git"
            developerConnection = "scm:git:git@github.com:iBotPeaches/Apktool.git"
            url = "https://github.com/iBotPeaches/Apktool"
        }
    }
}
